[workspace]
members = [
    "raphael-sim",
    "raphael-solver",
    "raphael-data",
    "raphael-data-updater",
    "raphael-cli",
    "raphael-translations",
]
resolver = "2"

[workspace.lints]
clippy.assigning_clones = "warn"
clippy.single_char_pattern = "warn"
clippy.return_self_not_must_use = "warn"
clippy.format_push_string = "warn"
clippy.ref_option = "warn"
clippy.default_trait_access = "warn"
clippy.explicit_iter_loop = "warn"
clippy.unnecessary_semicolon = "warn"
clippy.redundant_closure_for_method_calls = "warn"
clippy.use_self = "warn"

[workspace.dependencies]
raphael-sim = { path = "raphael-sim" }
raphael-solver = { path = "raphael-solver" }
raphael-data = { path = "raphael-data" }
raphael-translations = { path = "raphael-translations" }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
toml_edit = "0.23"
log = { version = "0.4", features = ["std"] }
web-time = "1.1.0"

[package]
name = "raphael-xiv"
version = "0.28.4"
edition = "2024"
default-run = "raphael-xiv"

[lints]
workspace = true

[dependencies]
raphael-sim = { workspace = true, features = ["serde"] }
raphael-solver = { workspace = true, features = ["serde"] }
raphael-data = { workspace = true, features = ["serde"] }
raphael-translations = { workspace = true }

egui = "0.34.3"
# `http` is pulled in by the default `self-update` feature (see [features]) instead of
# being listed here unconditionally. With default features the enabled set is identical
# to `["http", "webp"]`; `--no-default-features` drops it (and the ehttp/ureq/rustls/ring
# stack) for a pure-Rust build.
egui_extras = { version = "0.34.3", features = ["webp"] }
eframe = { version = "0.34.3", features = ["persistence"] }

rayon = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }
ron = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"
# Only used by the in-app self-updater; gated behind the `self-update` feature so that
# `--no-default-features` builds (e.g. pure-Rust cross-compiles) avoid the `ring` C/asm dep.
semver = { version = "1.0", optional = true }
self-replace = { version = "1.5.0", optional = true }
tempfile = { version = "3.24.0", optional = true }
ehttp = { version = "0.5.0", features = ["json"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
web-sys = "0.3.85"

[dev-dependencies]
expect-test = "1.5.1"
strum = "0.27"

[profile.release]
opt-level = 3
lto = "fat"
overflow-checks = false
codegen-units = 1
panic = "abort"

[profile.release.package.egui]
opt-level = "s"

[profile.release.package.eframe]
opt-level = "s"

[profile.release-with-debug]
inherits = "release"
debug = true
debug-assertions = true

[profile.test]
opt-level = 3
lto = "thin"
overflow-checks = true

[features]
default = ["self-update"]
dev-panel = []
# On-by-default so standard builds are unchanged. Bundles the only features that need a
# network/TLS stack (ehttp/ureq/rustls/ring): the in-app self-updater and the (unused)
# egui_extras HTTP image loader. Opt out with `--no-default-features` for a pure-Rust
# dependency tree, e.g. cross-compiling to Windows from macOS without a C toolchain.
self-update = ["dep:ehttp", "dep:self-replace", "dep:tempfile", "dep:semver", "egui_extras/http"]
